name: Deploy to Cloudflare

# Builds the site with @opennextjs/cloudflare and deploys it as a Worker.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   – API token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  – account id shown in the Workers & Pages overview
#
# While those secrets are missing the deploy job is skipped (no red build),
# and a warning annotation tells you what to configure. The D1 database, the
# two R2 buckets and the Images binding are declared in wrangler.jsonc and
# must already exist in that Cloudflare account.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1
  SITE_URL: https://impulsa-real-estate.aqui-rd.workers.dev

jobs:
  verify:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  guard:
    name: Cloudflare secrets
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Credenciales de Cloudflare presentes."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Deploy omitido::Faltan CLOUDFLARE_API_TOKEN y/o CLOUDFLARE_ACCOUNT_ID. Añádelos en Settings → Secrets and variables → Actions."
          fi

  deploy:
    name: Build & deploy
    needs: [verify, guard]
    if: needs.guard.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ env.SITE_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (OpenNext)
        run: npx opennextjs-cloudflare build

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare deploy

      - name: Summary
        run: |
          {
            echo "### Deploy completado"
            echo ""
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Worker: \`impulsa-real-estate\`"
            echo "- URL: $SITE_URL"
          } >> "$GITHUB_STEP_SUMMARY"
