services:
  web:
    build: .
    ports:
      - "127.0.0.1:7007:7007"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:7007}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_AGENT_PASSWORD: ${SEED_AGENT_PASSWORD:-}
    volumes:
      - impulsa-data:/app/data
    restart: unless-stopped
volumes:
  impulsa-data:
